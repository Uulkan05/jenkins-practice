name: Playwright Tests

on:
  push:
    branches:
      - master
      - main
  schedule:
    # 12:00 PM EST (UTC-5) = 17:00 UTC
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --reporter=list,html,junit
        env:
          PRACTICE_USERNAME: ${{ vars.PRACTICE_USERNAME }}
          PRACTICE_PASSWORD: ${{ vars.PRACTICE_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_REPORT: playwright-report
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/results.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          retention-days: 14
